name: Auto Create Tasks for BA
on:
  issues:
    types: [labeled]

jobs:
  create-subtasks:
    if: github.event.label.name == 'kind::story'
    runs-on: ubuntu-latest
    steps:
      - name: Create BE Task
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BE] ${context.payload.issue.title}`,
              body: `Thuộc Story: #${context.payload.issue.number}`,
              labels: ['team::BE']
            });

      - name: Create FE Task
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[FE] ${context.payload.issue.title}`,
              body: `Thuộc Story: #${context.payload.issue.number}`,
              labels: ['team::FE']
            });

      - name: Create QC Task
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[QC] ${context.payload.issue.title}`,
              body: `Thuộc Story: #${context.payload.issue.number}`,
              labels: ['team::QC']
            });
